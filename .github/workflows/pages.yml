name: Deploy study guide to Pages

"on":
  push:
    branches:
      - main
    paths:
      - study-guide/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: study-guide
    env:
      SITE_DIR: ${{ github.workspace }}/.pages-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: study-guide/requirements.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Build strict site
        run: >-
          NO_MKDOCS_2_WARNING=1
          python -m mkdocs build --strict
          --config-file mkdocs.yml
          --site-dir "$SITE_DIR"
      - name: Run focused tests
        run: python -m unittest discover -s tests -v
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 "$PAGE_URL" >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 10
          done
