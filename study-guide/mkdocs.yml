site_name: DiploDatos — Guía de estudio SAIJ
site_description: Guía de estudio de ciencia de datos aplicada a jurisprudencia argentina.
site_url: https://jnzader.github.io/DiploDatos/
strict: true

theme:
  name: material
  language: es
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar al modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar al modo claro

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: En esta página
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Inicio: index.md
  - Materias:
      - 1. Análisis y visualización: materias/01-analisis-visualizacion.md
      - 2. Exploración y curación: materias/02-exploracion-curacion.md
      - 3. Introducción al aprendizaje: materias/03-introduccion-aprendizaje.md
      - 4. Aprendizaje supervisado: materias/04-aprendizaje-supervisado.md
      - 5. Aprendizaje no supervisado: materias/05-aprendizaje-no-supervisado.md
      - 6. Ética práctica: materias/06-etica-practica.md
  - Proyecto integrador: proyecto-integrador.md
  - Apéndice: apendice.md

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/vendor/mathjax/es5/tex-mml-chtml.js
